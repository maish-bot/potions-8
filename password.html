<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POTIONS — Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* Locks page scroll completely */
      }

      body {
        background-color: #000000;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
      }

      /* Split Screen Container fixed to full height */
      .split-screen {
        display: flex;
        height: 100vh;
        height: 100dvh;
        width: 100%;
        overflow: hidden;
      }

      /* Left Side: Image Panel */
      .split-image-panel {
        flex: 1;
        background-image: url('scalp-main.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        position: relative;
      }

      /* Image tint overlay */
      .split-image-panel::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.3);
      }

      /* Right Side: Form Panel */
      .split-form-panel {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        padding: 1rem;
      }

      .pass-container {
        width: 100%;
        max-width: 460px;
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* Logo Container — Scaled Up & Centered */
      .logo-container {
        width: 100%;
        max-width: 400px; /* Increased max width to make sign bigger */
        margin: 0 auto clamp(0.5rem, 2vh, 1.5rem) auto;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .brand-logo {
        width: 100%;
        height: auto;
        max-height: clamp(120px, 28vh, 320px); /* Increased viewport height scaling */
        object-fit: contain;
        margin: 0 auto;
        display: block;
      }

      /* Form Wrapper */
      .pass-form-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      #waitlist-mode, #password-mode {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Integrated Split Input/Button Group */
      .split-input-group {
        display: flex;
        width: 100%;
        background-color: var(--accent-orange, #ff832a);
        padding: 3px;
        align-items: center;
      }

      .split-input {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: none;
        color: #000000;
        padding: clamp(0.5rem, 1.2vh, 0.75rem) 0.85rem;
        font-family: 'Inter', sans-serif;
        font-size: clamp(0.8rem, 1.3vh, 0.95rem);
        font-weight: 600;
        line-height: 1.2;
        outline: none;
      }

      .split-input::placeholder {
        color: rgba(0, 0, 0, 0.7);
        font-weight: 500;
      }

      .split-btn {
        background: #000000;
        color: #ffffff;
        border: none;
        padding: clamp(0.5rem, 1.2vh, 0.75rem) clamp(0.75rem, 1.5vw, 1.25rem);
        font-family: 'Syne', sans-serif;
        font-size: clamp(0.7rem, 1.1vh, 0.85rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: 1px;
        cursor: pointer;
        text-transform: uppercase;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease, color 0.2s ease;
      }

      .split-btn:hover {
        background: #ffffff;
        color: #000000;
      }

      /* Mode Toggle Button */
      .toggle-mode-btn {
        background: transparent;
        border: none;
        color: var(--accent-orange, #ff832a);
        font-family: 'Inter', sans-serif;
        font-size: clamp(0.75rem, 1.2vh, 0.85rem);
        font-weight: 600;
        margin-top: clamp(0.5rem, 1.5vh, 1rem);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
      }

      .toggle-mode-btn:hover {
        text-decoration: underline;
      }

      .lock-icon {
        width: 13px;
        height: 13px;
        fill: currentColor;
        flex-shrink: 0;
      }

      /* Subtitle / Tagline */
      .brand-sub {
        font-size: clamp(0.7rem, 1.1vh, 0.8rem);
        color: var(--accent-orange, #ff832a);
        margin-top: clamp(0.8rem, 2vh, 1.8rem);
        letter-spacing: 0.5px;
        font-family: 'Inter', sans-serif;
        font-weight: 500;
        line-height: 1.3;
      }

      .error-msg {
        color: #ff4d4d;
        font-size: 0.75rem;
        margin-top: 0.4rem;
        display: none;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
      }

      /* Mobile Layout */
      @media (max-width: 768px) {
        .split-screen {
          flex-direction: column;
        }

        .split-image-panel {
          flex: 0 0 25vh; /* Reduced top image height to leave max room for logo */
          min-height: 0;
        }

        .split-form-panel {
          flex: 1;
          padding: 0.75rem;
        }

        .logo-container {
          max-width: 260px;
        }

        .brand-logo {
          max-height: clamp(100px, 25vh, 200px);
        }
      }
    </style>
</head>
<body>

    <div class="split-screen">
      
      <!-- LEFT PANEL: IMAGE -->
      <div class="split-image-panel"></div>

      <!-- RIGHT PANEL: FORM & CONTENT -->
      <div class="split-form-panel">
        <div class="pass-container">
          
          <!-- Brand Logo (Enlarged & Centered) -->
          <div class="logo-container">
            <img src="potions-logo.png" alt="POTIONS Logo" class="brand-logo">
          </div>

          <div class="pass-form-wrapper">
            
            <!-- MODE 1: EMAIL WAITLIST FORM -->
            <div id="waitlist-mode">
              <form action="YOUR_GOOGLE_FORM_URL_HERE" method="POST" target="_blank" style="width: 100%;">
                <div class="split-input-group">
                  <input type="email" name="entry.YOUR_ENTRY_ID" placeholder="Email" required class="split-input">
                  <button type="submit" class="split-btn">SUBMIT</button>
                </div>
              </form>

              <button type="button" id="btn-show-pass" class="toggle-mode-btn">
                <svg class="lock-icon" viewBox="0 0 24 24">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                Password
              </button>
            </div>

            <!-- MODE 2: PASSWORD ACCESS FORM -->
            <div id="password-mode" style="display: none;">
              <form id="pass-form" style="width: 100%;">
                <div class="split-input-group">
                  <input type="password" id="pass-input" placeholder="Password" required class="split-input">
                  <button type="submit" class="split-btn">ENTER</button>
                </div>
                <p id="pass-error" class="error-msg">INVALID PASSWORD</p>
              </form>

              <button type="button" id="btn-show-waitlist" class="toggle-mode-btn">
                Back to Email Sign-up
              </button>
            </div>

          </div>

          <!-- Footer Tagline -->
          <p class="brand-sub">- sign up for password upon release -</p>

        </div>
      </div>

    </div>

    <script>
      const SITE_PASSWORD = "POTIONS2026";

      const waitlistMode = document.getElementById('waitlist-mode');
      const passMode     = document.getElementById('password-mode');
      const btnShowPass  = document.getElementById('btn-show-pass');
      const btnShowWait  = document.getElementById('btn-show-waitlist');
      const passForm     = document.getElementById('pass-form');
      const passInput    = document.getElementById('pass-input');
      const passError    = document.getElementById('pass-error');

      btnShowPass.addEventListener('click', () => {
        waitlistMode.style.display = 'none';
        passMode.style.display = 'flex';
      });

      btnShowWait.addEventListener('click', () => {
        passMode.style.display = 'none';
        waitlistMode.style.display = 'flex';
      });

      passForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (passInput.value === SITE_PASSWORD) {
          sessionStorage.setItem('siteUnlocked', 'true');
          window.location.href = 'index.html';
        } else {
          passError.style.display = 'block';
        }
      });
    </script>
</body>
</html>
